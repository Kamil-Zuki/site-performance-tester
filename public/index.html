<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование производительности сайта</title>
    <!-- Подключаем TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="max-w-4xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <div class="bg-white rounded-xl shadow-lg p-8">
            <h1 class="text-3xl font-bold mb-6 text-indigo-600 text-center">Site Performance Tester</h1>
            <p class="text-gray-500 mb-8 text-center text-sm">Утилита для нагрузочного тестирования страниц с рендерингом в браузере</p>

            <!-- Форма настроек -->
            <form id="testForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">URL сайта для проверки</label>
                    <input type="url" id="url" required class="mt-1 p-3 w-full border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="https://test.steos.io/company/individuals" value="https://test.steos.io/company/individuals">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Всего запросов</label>
                        <input type="number" id="totalRequests" required value="100" min="1" max="1000" class="mt-1 p-3 w-full border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Одновременных (потоки)</label>
                        <input type="number" id="concurrency" required value="10" min="1" max="50" class="mt-1 p-3 w-full border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Лимит времени (мс)</label>
                        <input type="number" id="timeoutMs" required value="3000" min="500" class="mt-1 p-3 w-full border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>

                <div class="pt-4 flex space-x-4">
                    <button type="submit" id="startBtn" class="flex-1 flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Запустить тестирование
                    </button>
                    <button type="button" id="stopBtn" class="hidden flex-none justify-center py-3 px-6 border border-gray-300 rounded-lg shadow-sm text-lg font-medium text-red-600 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors">
                        Остановить
                    </button>
                </div>
            </form>

            <!-- Прогресс и Результаты (скрыты по умолчанию) -->
            <div id="resultsSection" class="mt-10 hidden border-t border-gray-200 pt-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-800" id="statusHeader">Идет проверка...</h2>
                
                <!-- Прогресс бар -->
                <div class="relative pt-1 mb-6">
                    <div class="flex mb-2 items-center justify-between">
                        <div>
                            <span id="progressText" class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-indigo-600 bg-indigo-200">
                                0% (0 / 100)
                            </span>
                        </div>
                    </div>
                    <div class="overflow-hidden h-3 mb-4 text-xs flex rounded bg-indigo-100">
                        <div id="progressBar" style="width:0%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-indigo-500 transition-all duration-300"></div>
                    </div>
                </div>

                <!-- Карточки статистики -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-gray-50 rounded-lg p-4 text-center border border-gray-100 shadow-sm">
                        <div class="text-sm text-gray-500 mb-1">Всего</div>
                        <div id="statTotal" class="text-2xl font-bold text-gray-800">-</div>
                    </div>
                    <div class="bg-green-50 rounded-lg p-4 text-center border border-green-100 shadow-sm">
                        <div class="text-sm text-green-600 mb-1">Успешно (до 3с)</div>
                        <div id="statFast" class="text-2xl font-bold text-green-600">-</div>
                    </div>
                    <div class="bg-yellow-50 rounded-lg p-4 text-center border border-yellow-100 shadow-sm">
                        <div class="text-sm text-yellow-600 mb-1">Долго (дольше 3с)</div>
                        <div id="statSlow" class="text-2xl font-bold text-yellow-600">-</div>
                    </div>
                    <div class="bg-red-50 rounded-lg p-4 text-center border border-red-100 shadow-sm">
                        <div class="text-sm text-red-600 mb-1">Ошибки</div>
                        <div id="statFailed" class="text-2xl font-bold text-red-600">-</div>
                    </div>
                </div>

                <!-- Лог действий -->
                <div class="bg-gray-900 rounded-lg p-4 h-48 overflow-y-auto">
                    <pre id="logOutput" class="text-sm text-green-400 font-mono whitespace-pre-wrap"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resultsSection = document.getElementById('resultsSection');
        const logOutput = document.getElementById('logOutput');
        
        let eventSource = null;
        let currentTestId = null;

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let color = 'text-green-400';
            if(type === 'error') color = 'text-red-400';
            if(type === 'warn') color = 'text-yellow-400';
            
            logOutput.innerHTML += `<span class="text-gray-500">[${time}]</span> <span class="${color}">${msg}</span>\n`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        stopBtn.addEventListener('click', async () => {
            if (!currentTestId) return;
            
            log('Отправка команды на остановку...', 'warn');
            stopBtn.disabled = true;
            stopBtn.innerText = 'Останавливаем...';

            try {
                const response = await fetch('/api/stop-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ testId: currentTestId })
                });
                const data = await response.json();
                if (data.success) {
                    log('Тест будет остановлен после завершения текущих активных запросов', 'warn');
                }
            } catch (err) {
                log('Ошибка при попытке остановить тест: ' + err.message, 'error');
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (eventSource) {
                eventSource.close();
            }

            // Генерируем уникальный ID для этого теста
            currentTestId = 'test_' + Math.random().toString(36).substr(2, 9);

            // Получаем данные из формы
            const url = document.getElementById('url').value;
            const total = document.getElementById('totalRequests').value;
            const concurrency = document.getElementById('concurrency').value;
            const timeout = document.getElementById('timeoutMs').value;

            // Сбрасываем UI
            resultsSection.classList.remove('hidden');
            logOutput.innerHTML = '';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = `0% (0 / ${total})`;
            document.getElementById('statusHeader').innerText = 'Идёт проверка...';
            document.getElementById('statusHeader').className = 'text-xl font-semibold mb-4 text-indigo-600';
            
            ['Total', 'Fast', 'Slow', 'Failed'].forEach(id => document.getElementById('stat' + id).innerText = '-');

            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            startBtn.innerText = 'Тестирование в процессе...';
            
            stopBtn.classList.remove('hidden');
            stopBtn.disabled = false;
            stopBtn.innerText = 'Остановить';

            log(`Инициализация теста для ${url}`);
            log(`Настройки: ${total} запросов, ${concurrency} потоков, ${timeout}мс лимит`);

            // Подключаемся по SSE
            const queryParams = new URLSearchParams({ 
                url, 
                testId: currentTestId,
                totalRequests: total, 
                concurrency, 
                timeoutMs: timeout 
            });
            eventSource = new EventSource(`/api/run-test?${queryParams.toString()}`);

            eventSource.onmessage = (event) => {
                const response = JSON.parse(event.data);
                
                if (response.error) {
                    log(response.error, 'error');
                    eventSource.close();
                    finishTest(false);
                    return;
                }

                if (response.status === 'started') {
                    log(response.message);
                } 
                else if (response.status === 'progress') {
                    const data = response.data;
                    const percent = Math.round((data.completedRequests / data.totalRequests) * 100);
                    
                    document.getElementById('progressBar').style.width = `${percent}%`;
                    document.getElementById('progressText').innerText = `${percent}% (${data.completedRequests} / ${data.totalRequests})`;
                    
                    document.getElementById('statTotal').innerText = data.completedRequests;
                    document.getElementById('statFast').innerText = data.successfulRequests - data.slowRequests;
                    document.getElementById('statSlow').innerText = data.slowRequests;
                    document.getElementById('statFailed').innerText = data.failedRequests;
                } 
                else if (response.status === 'completed' || response.status === 'cancelled') {
                    const resData = response.data;
                    const isCancelled = response.status === 'cancelled';
                    
                    log(isCancelled ? 'Тестирование прервано пользователем' : 'Тестирование успешно завершено!', isCancelled ? 'warn' : 'info');
                    
                    // Обновляем финальные цифры
                    document.getElementById('statTotal').innerText = resData.totalRequests;
                    document.getElementById('statFast').innerText = resData.fastRequests;
                    document.getElementById('statSlow').innerText = resData.slowRequests;
                    document.getElementById('statFailed').innerText = resData.failedRequests;

                    if (isCancelled) {
                        document.getElementById('statusHeader').innerText = 'Тестирование остановлено';
                        document.getElementById('statusHeader').className = 'text-xl font-semibold mb-4 text-yellow-600';
                    } else {
                        document.getElementById('statusHeader').innerText = 'Тестирование завершено!';
                        document.getElementById('statusHeader').className = 'text-xl font-semibold mb-4 text-green-600';
                        document.getElementById('progressText').classList.replace('text-indigo-600', 'text-green-600');
                        document.getElementById('progressText').classList.replace('bg-indigo-200', 'bg-green-200');
                        document.getElementById('progressBar').classList.replace('bg-indigo-500', 'bg-green-500');
                    }

                    finishTest(true);
                } 
                else if (response.status === 'error') {
                    log(`Критическая ошибка: ${response.message}`, 'error');
                    finishTest(false);
                }
            };

            eventSource.onerror = (err) => {
                log('Связь с сервером прервана', 'error');
                eventSource.close();
                finishTest(false);
            };
        });

        function finishTest(success) {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            currentTestId = null;
            
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            startBtn.innerText = 'Запустить тестирование снова';
            
            stopBtn.classList.add('hidden');

            if (!success) {
                document.getElementById('statusHeader').innerText = 'Ошибка тестирования';
                document.getElementById('statusHeader').className = 'text-xl font-semibold mb-4 text-red-600';
            }
        }
    </script>
</body>
</html>
